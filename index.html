<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고래의 하루</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="고래의 하루">
<meta name="theme-color" content="#FEFAD5">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Pretendard:wght@400;500;600&display=swap');

  :root{
    --bg: #FBF7EC;
    --bg-deep: #F3ECD8;
    --card: #FBF7EC;
    --yolk: #FBF7EC;
    --yolk-soft: #F3ECD8;
    --yolk-deep: #C9B98A;
    --ink: #4A3324;
    --ink-soft: #8C7C68;
    --line: #D9CBA8;
    --shadow: rgba(0,0,0,0);
    --whale: #4A3324;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    font-family: 'Pretendard', -apple-system, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    color: var(--ink);
    padding-bottom: 40px;
  }

  .wrap{ max-width: 480px; margin: 0 auto; padding: 40px 24px 20px; }

  /* Header */
  header{ margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; }
  .logo-mark{
    width: 40px;
    height: auto;
    flex-shrink: 0;
    opacity: 0.75;
  }
  .header-text{ flex: 1; }
  h1{
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .sub{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 4px;
    font-family: 'Noto Serif KR', serif;
    font-style: italic;
  }

  /* Streak / stat bar */
  .stat-row{
    display:flex; gap:0; margin: 0 0 28px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .stat{
    flex:1;
    padding: 14px 6px;
    text-align:center;
    border-right: 1px solid var(--line);
  }
  .stat:last-child{ border-right: none; }
  .stat .num{ font-family:'Noto Serif KR',serif; font-size:19px; font-weight:700; color: var(--ink); }
  .stat .lab{ font-size: 10.5px; color: var(--ink-soft); margin-top:3px; letter-spacing: 0.02em; }

  /* New entry button */
  .new-btn{
    width: 100%;
    background: transparent;
    border: 1px solid var(--ink);
    border-radius: 2px;
    padding: 14px;
    font-family: 'Noto Serif KR', serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    margin-bottom: 32px;
    letter-spacing: 0.02em;
  }
  .new-btn:active{ background: var(--bg-deep); }

  /* Section title */
  .sec-title{
    font-family:'Noto Serif KR', serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 4px 0 14px 0;
    letter-spacing: 0.04em;
  }

  /* Mood filter chips */
  .mood-filters{
    display:flex; gap:0; margin-bottom: 22px; overflow-x:auto; padding-bottom:8px;
    border-bottom: 1px solid var(--line);
  }
  .chip{
    flex-shrink:0;
    padding: 4px 14px 4px 0;
    background: transparent;
    border: none;
    font-size: 12.5px;
    color: var(--ink-soft);
    cursor: pointer;
    white-space:nowrap;
    font-family: 'Noto Serif KR', serif;
  }
  .chip.active{
    color: var(--ink);
    font-weight:700;
    text-decoration: underline;
    text-underline-offset: 4px;
  }

  /* Entry list */
  .entry-card{
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    padding: 18px 2px 18px;
    margin-bottom: 0;
    cursor: pointer;
    position: relative;
  }
  .entry-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom: 8px;
  }
  .entry-date{
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 500;
    letter-spacing: 0.03em;
  }
  .entry-mood{
    font-size: 17px;
    opacity: 0.85;
  }
  .entry-title{
    font-family: 'Noto Serif KR', serif;
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--ink);
  }
  .entry-preview{
    font-size: 13px;
    line-height: 1.65;
    color: var(--ink-soft);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .entry-tags{ display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }
  .tag{
    font-size: 11px;
    background: transparent;
    color: var(--ink-soft);
    padding: 0;
    border-radius: 0;
    font-style: italic;
  }

  .empty{
    text-align:center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .empty .logo-mark{ margin: 0 auto 18px; opacity: 0.3; }
  .empty p{ font-size: 13.5px; line-height:1.7; font-family: 'Noto Serif KR', serif; }

  /* Modal / editor */
  .overlay{
    position: fixed; inset:0;
    background: rgba(74,51,36,0.3);
    display:none;
    align-items:flex-end;
    z-index: 50;
  }
  .overlay.open{ display:flex; }
  .sheet{
    background: var(--bg);
    width:100%;
    max-height: 92vh;
    border-radius: 0;
    border-top: 3px solid var(--ink);
    padding: 24px 24px 28px;
    overflow-y:auto;
  }

  .sheet-head{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
  }
  .sheet-head h2{
    font-family:'Noto Serif KR', serif;
    font-size: 19px;
    font-weight: 700;
  }
  .icon-btn{
    background: transparent;
    border: none;
    width: 30px; height:30px;
    font-size: 17px;
    color: var(--ink-soft);
    cursor:pointer;
  }

  .field-lab{ font-size: 11.5px; color: var(--ink-soft); margin: 16px 0 7px 0; font-weight:600; letter-spacing: 0.03em; }

  .mood-pick{ display:flex; gap:0; border-bottom: 1px solid var(--line); }
  .mood-opt{
    flex:1;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 10px 0;
    text-align:center;
    font-size: 21px;
    cursor:pointer;
    opacity: 0.5;
  }
  .mood-opt.sel{ border-bottom-color: var(--ink); opacity: 1; }

  input[type=text], textarea{
    width:100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    padding: 10px 2px;
    font-family: 'Pretendard', sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    outline:none;
  }
  input[type=text]:focus, textarea:focus{ border-bottom-color: var(--ink); }
  textarea{ min-height: 150px; line-height:1.7; resize: vertical; }
  input::placeholder, textarea::placeholder{ color: #C4B392; }

  .tag-input-row{ display:flex; gap:8px; }
  .tag-input-row input{ flex:1; }
  .tag-add{
    background: transparent;
    border: 1px solid var(--ink-soft); border-radius: 0;
    width: 40px;
    font-size: 15px; font-weight:700;
    color: var(--ink);
    cursor:pointer;
  }
  .cur-tags{ display:flex; gap:12px; flex-wrap:wrap; margin-top: 10px; }
  .cur-tag{
    background: transparent;
    color: var(--ink-soft);
    font-size: 12px;
    padding: 0;
    border-radius: 0;
    display:flex; align-items:center; gap:5px;
    font-style: italic;
  }
  .cur-tag span{ cursor:pointer; opacity:0.6; font-weight:700; font-style: normal; }

  .save-btn{
    width:100%;
    margin-top: 26px;
    background: var(--ink);
    border:none;
    border-radius: 2px;
    padding: 15px;
    font-family:'Noto Serif KR', serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--bg);
    cursor:pointer;
    letter-spacing: 0.02em;
  }

  .delete-btn{
    width:100%;
    margin-top: 12px;
    background: transparent;
    border: none;
    padding: 13px;
    font-size: 12.5px;
    font-weight: 500;
    color: #A56850;
    cursor:pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .toast{
    position: fixed;
    bottom: 24px; left:50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--bg);
    padding: 9px 20px;
    border-radius: 2px;
    font-size: 12.5px;
    z-index: 100;
    opacity:0;
    transition: opacity 0.2s;
    pointer-events:none;
    font-family: 'Noto Serif KR', serif;
  }
  .toast.show{ opacity: 1; }

  ::-webkit-scrollbar{ width:0; }
</style>
</head>

<script>
const MOODS = [
  {key:'happy', emoji:'😊', label:'좋음'},
  {key:'calm', emoji:'😌', label:'평온'},
  {key:'tired', emoji:'😪', label:'피곤'},
  {key:'sad', emoji:'😢', label:'슬픔'},
  {key:'angry', emoji:'😤', label:'짜증'},
];

let entries = [];
let editingId = null;
let selectedMood = 'happy';
let curTags = [];
let activeFilter = 'all';

const $ = id => document.getElementById(id);

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function fmtDate(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 1600);
}

async function loadEntries(){
  try{
    const raw = localStorage.getItem('diary-entries');
    entries = raw ? JSON.parse(raw) : [];
  }catch(e){
    entries = [];
  }
  renderAll();
}

async function saveEntries(){
  try{
    localStorage.setItem('diary-entries', JSON.stringify(entries));
  }catch(e){
    console.error('저장 실패', e);
    toast('저장에 실패했어요');
  }
}

function renderMoodFilters(){
  const wrap = $('moodFilters');
  wrap.innerHTML = '';
  const all = document.createElement('div');
  all.className = 'chip' + (activeFilter==='all' ? ' active' : '');
  all.textContent = '전체';
  all.onclick = () => { activeFilter='all'; renderAll(); };
  wrap.appendChild(all);

  MOODS.forEach(m=>{
    const c = document.createElement('div');
    c.className = 'chip' + (activeFilter===m.key ? ' active' : '');
    c.textContent = `${m.emoji} ${m.label}`;
    c.onclick = () => { activeFilter = m.key; renderAll(); };
    wrap.appendChild(c);
  });
}

function renderStats(){
  $('statTotal').textContent = entries.length;

  const now = new Date();
  const curMonth = now.getMonth(), curYear = now.getFullYear();
  const monthCount = entries.filter(e=>{
    const d = new Date(e.date + 'T00:00:00');
    return d.getMonth()===curMonth && d.getFullYear()===curYear;
  }).length;
  $('statMonth').textContent = monthCount;

  // streak calc
  const dateSet = new Set(entries.map(e=>e.date));
  let streak = 0;
  let cursor = new Date();
  while(true){
    const ds = cursor.toISOString().slice(0,10);
    if(dateSet.has(ds)){
      streak++;
      cursor.setDate(cursor.getDate()-1);
    } else break;
  }
  $('statStreak').textContent = streak;
}

        <div class="entry-date">${fmtDate(e.date)}</div>

      </div>

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderAll(){
  renderMoodFilters();
  renderStats();
  renderList();
}

function renderMoodPick(){
  const wrap = $('moodPick');
  wrap.innerHTML = '';
  MOODS.forEach(m=>{
    const d = document.createElement('div');
    d.className = 'mood-opt' + (selectedMood===m.key ? ' sel' : '');
    d.textContent = m.emoji;
    d.onclick = () => { selectedMood = m.key; renderMoodPick(); };
    wrap.appendChild(d);
  });
}

function renderCurTags(){
  const wrap = $('curTags');
  wrap.innerHTML = '';
  curTags.forEach((t,i)=>{
    const el = document.createElement('div');
    el.className = 'cur-tag';
    el.innerHTML = `#${escapeHtml(t)} <span>✕</span>`;
    el.querySelector('span').onclick = () => { curTags.splice(i,1); renderCurTags(); };
    wrap.appendChild(el);
  });
}

function openEditor(id){
  editingId = id;
  const e = entries.find(x=>x.id===id);
  if(e){
    $('sheetTitle').textContent = '일기 수정';
    selectedMood = e.mood;
    $('entryTitle').value = e.title || '';
    $('entryBody').value = e.body || '';
    curTags = [...(e.tags||[])];
    $('deleteBtn').style.display = 'block';
  } else {
    $('sheetTitle').textContent = '일기 쓰기';
    selectedMood = 'happy';
    $('entryTitle').value = '';
    $('entryBody').value = '';
    curTags = [];
    $('deleteBtn').style.display = 'none';
  }
  renderMoodPick();
  renderCurTags();
  $('tagInput').value = '';
  $('overlay').classList.add('open');
}

function closeEditor(){
  $('overlay').classList.remove('open');
  editingId = null;
}

$('openNew').onclick = () => openEditor(null);
$('closeSheet').onclick = closeEditor;
$('overlay').onclick = (ev) => { if(ev.target.id==='overlay') closeEditor(); };

$('tagAddBtn').onclick = () => {
  const v = $('tagInput').value.trim();
  if(v && !curTags.includes(v)){
    curTags.push(v);
    renderCurTags();
  }
  $('tagInput').value = '';
};
$('tagInput').addEventListener('keydown', (ev)=>{
  if(ev.key==='Enter'){ ev.preventDefault(); $('tagAddBtn').click(); }
});

$('saveBtn').onclick = async () => {
  const title = $('entryTitle').value.trim();
  const body = $('entryBody').value.trim();
  if(!body){
    toast('내용을 입력해주세요');
    return;
  }

  if(editingId){
    const e = entries.find(x=>x.id===editingId);
    e.title = title;
    e.body = body;
    e.mood = selectedMood;
    e.tags = [...curTags];
  } else {
    entries.push({
      id: Date.now().toString(),
      date: todayStr(),
      title, body,
      mood: selectedMood,
      tags: [...curTags],
      createdAt: Date.now()
    });
  }

  await saveEntries();
  closeEditor();
  renderAll();
  toast('저장되었어요 🌼');
};

$('deleteBtn').onclick = async () => {
  entries = entries.filter(e=>e.id!==editingId);
  await saveEntries();
  closeEditor();
  renderAll();
  toast('삭제되었어요');
};

(function initTodayLabel(){
  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];
  $('todayLabel').textContent = `${d.getMonth()+1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;
})();

loadEntries();
</script>
