<!DOCTYPE html>
<html lang="ko">
<head>

<style>
  * { box-sizing: border-box; }
  :root { --kr-font: 'Song Myung'; }
  html { background: #eef2ea; }
  body { margin: 0; background: #eef2ea; min-height: 100vh; font-family: 'EB Garamond', var(--kr-font), Georgia, serif; color: #2f3b2f; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 22px 16px 40px 16px; }
  .header-row { display: flex; align-items: flex-end; gap: 4px; }
  .whale-icon { width: 44px; height: auto; flex-shrink: 0; display: block; margin-bottom: 2px; }
  .header-text { margin: 0; padding: 0; text-align: left; }
  .eyebrow { display: block; margin: 0; padding: 0; font-size: 11px; letter-spacing: 2px; color: #3f5a45; text-transform: uppercase; line-height: 1; }
  h1 { font-family: 'Playfair Display', var(--kr-font), Georgia, serif; font-size: 28px; font-weight: 500; color: #2b4030;
    margin: 4px 0 0 -0.06em; padding: 0; line-height: 1; text-align: left; }
  .counts { display: flex; gap: 14px; margin: 16px 0 18px 0; }
  .count-card { flex: 1; background: #fbf9f3; border: 1px solid #d8e0d2; border-radius: 10px; padding: 8px 10px; cursor: pointer; }
  .count-card:active { background: #eef2ea; }
  .count-card.active { border-color: #3f5a45; background: #eef6ea; }
  .search-bar { margin: 8px 0 4px 0; }
  .search-bar input { width: 100%; box-sizing: border-box; padding: 9px 12px; border-radius: 8px;
    border: 1px solid #d8e0d2; background: #fff; font-family: 'EB Garamond', var(--kr-font), Georgia, serif;
    font-size: 13.5px; color: #2f3b2f; outline: none; }
  .count-num { font-family: 'Playfair Display', var(--kr-font), Georgia, serif; font-size: 18px; color: #2b4030; }
  .count-label { font-size: 10.5px; color: #6b7a67; margin-top: 1px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs-row { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 14px; }
  .tab-btn, .status-btn { font-family: 'EB Garamond', var(--kr-font), Georgia, serif; font-size: 12.5px; padding: 7px 12px;
    border-radius: 999px; border: 1px solid #d8e0d2; background: transparent; color: #6b7a67; cursor: pointer; }
  .tab-btn.active, .status-btn.active { border-color: #3f5a45; background: #3f5a45; color: #fff; }
  .add-btn { width: 100%; padding: 11px; margin-bottom: 16px; border-radius: 10px;
    border: 1px dashed #3f5a45; background: transparent; color: #3f5a45; cursor: pointer;
    font-family: 'Playfair Display', var(--kr-font), Georgia, serif; font-size: 15px; font-weight: 700; }
  .book-card { background: #fbf9f3; border-radius: 14px; margin-bottom: 10px; overflow: hidden; border: 1px solid #d8e0d2; }
  .book-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
  .spine { width: 10px; height: 44px; border-radius: 3px; flex-shrink: 0; }
  .cover-thumb { width: 34px; height: 44px; object-fit: cover; border-radius: 4px; flex-shrink: 0; background: #e5ece2; }
  .book-title { font-family: 'Playfair Display', var(--kr-font), Georgia, serif; font-size: 16px; font-weight: 500; color: #2f3b2f;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .book-author { font-size: 11.5px; color: #6b7a67; margin-top: 1px; }
  .book-line { font-size: 12.5px; color: #6b7a67; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-main { flex: 1; min-width: 0; }
  .chevron { color: #6b7a67; font-size: 12px; transition: transform 0.15s; }
  .chevron.open { transform: rotate(90deg); }
  .stars span { font-size: 17px; cursor: pointer; color: #d8e0d2; line-height: 1; user-select: none; }
  .rating-col { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
  .row-month-tag { font-family: 'EB Garamond', var(--kr-font), Georgia, serif; font-size: 10.5px;
    font-weight: 600; padding: 3px 8px 3px 7px; border-radius: 3px; border-left: 3px solid; white-space: nowrap; }
  .stars span.filled { color: #c98a72; }
  .stars.small span { font-size: 12px; cursor: default; }
  .detail { padding: 4px 16px 18px 16px; border-top: 1px solid #d8e0d2; display: none; }
  .detail.open { display: block; }
  .field { margin-bottom: 12px; }
  .field-label { font-size: 11.5px; color: #6b7a67; margin-bottom: 5px; }
  .field input, .field textarea { width: 100%; box-sizing: border-box; padding: 9px 11px; border-radius: 8px;
    border: 1px solid #d8e0d2; background: #fff; font-family: 'EB Garamond', var(--kr-font), Georgia, serif;
    font-size: 13.5px; color: #2f3b2f; outline: none; }
  .field textarea { min-height: 64px; resize: none; overflow: hidden; }
  .rating-month-row { display: flex; gap: 10px; }
  .rating-month-box { flex: 1; min-width: 0; background: #f4f8f1; border: 1px solid #e3ecdd; border-radius: 10px;
    padding: 6px 10px; display: flex; flex-direction: column; gap: 3px; }
  .rating-month-box .field-label { margin-bottom: 0; }
  .month-select-group { display: flex; gap: 4px; }
  .month-pill { flex: 1; min-width: 0; box-sizing: border-box; padding: 3px 2px; border-radius: 999px;
    border: 1px solid #d8e0d2; background: #fff; font-family: 'EB Garamond', var(--kr-font), Georgia, serif;
    font-size: 11px; color: #2f3b2f; outline: none; text-align: center; }
  .cover-input-row { display: flex; gap: 6px; align-items: center; }
  .cover-input-row input[type=text] { flex: 1; }
  .upload-btn { font-size: 12px; padding: 9px 10px; border-radius: 8px; border: 1px solid #d8e0d2;
    background: #fff; color: #3f5a45; cursor: pointer; white-space: nowrap; }
  .cover-preview { margin-top: 8px; width: 100%; max-width: 160px; border-radius: 8px; display: block; }
  .status-row { display: flex; gap: 6px; }
  .delete-link { margin-top: 4px; background: transparent; border: none; color: #c98a72; font-size: 12.5px; cursor: pointer; padding: 0; }
  .save-row { display: flex; align-items: center; gap: 10px; margin: 14px 0 10px 0; }
  .save-btn { font-family: 'EB Garamond', var(--kr-font), Georgia, serif; font-size: 13.5px; padding: 8px 18px;
    border-radius: 8px; border: none; background: #3f5a45; color: #fff; cursor: pointer; }
  .save-status { font-size: 11.5px; color: #8fae86; }
  .empty { text-align: center; color: #6b7a67; font-size: 13px; padding: 30px 0; }
  #bookList { -webkit-user-select: none; user-select: none; }
  .swipe-container { display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .swipe-container::-webkit-scrollbar { display: none; }
  .swipe-panel { flex: 0 0 100%; width: 100%; min-width: 0; scroll-snap-align: start; box-sizing: border-box; }

  .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-box { width: 100%; max-width: 320px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .login-whale { width: 100px; height: auto; margin-bottom: 14px; }
  .login-box h1 { font-family: 'Playfair Display', var(--kr-font), Georgia, serif; font-size: 24px;
    font-weight: 500; color: #2b4030; margin: 0 0 8px 0; }
  .login-sub { font-size: 12.5px; color: #6b7a67; margin: 0 0 20px 0; }
  .login-error { color: #c9724a; font-size: 12px; min-height: 16px; margin-bottom: 6px; }
  .google-btn { display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; box-sizing: border-box; padding: 12px 20px; border-radius: 999px;
    border: 1px solid #d8e0d2; background: #fff; color: #2f3b2f; cursor: pointer;
    font-family: 'EB Garamond', var(--kr-font), Georgia, serif; font-size: 14.5px; font-weight: 600;
    box-shadow: 0 2px 8px rgba(43,64,48,0.08); margin-top: 4px; }
  .google-btn img { width: 18px; height: 18px; }
  .sync-status { text-align: center; font-size: 11px; color: #8fae86; margin: -4px 0 10px 0; }
  .logout-link { display: block; text-align: center; font-size: 11px; color: #a9baa4;
    text-decoration: underline; background: none; border: none; cursor: pointer; margin: 6px auto 0 auto; }
  .list-actions { display: flex; gap: 5px; flex-shrink: 0; margin-left: auto; }
  .backup-row { display: flex; justify-content: center; gap: 14px; margin: 24px 0 4px 0; }
  .backup-link { font-family: 'EB Garamond', var(--kr-font), Georgia, serif; font-size: 11.5px;
    background: none; border: none; color: #8fae86; text-decoration: underline; cursor: pointer; }
  .stamp-month-group { margin-bottom: 22px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .stamp-month-label { font-family: 'Playfair Display', var(--kr-font), Georgia, serif; font-size: 17px;
    color: #2b4030; display: flex; flex-direction: column; align-items: center; gap: 3px; flex-shrink: 0; }
  .stamp-month-count { font-size: 15px; color: #8fae86; font-family: 'EB Garamond', var(--kr-font), Georgia, serif; }
  .stamp-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .stamp-item { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center;
    background: #fbf9f3; border: 1px solid #d8e0d2; border-radius: 50%; padding: 8px; box-sizing: border-box; }
  .stamp-item img { width: 100%; height: 100%; object-fit: contain; }
  .stamp-item.has-cover { width: 52px; height: 70px; border-radius: 5px; border: 1px solid #d8e0d2;
    padding: 0; overflow: hidden; box-shadow: 0 2px 5px rgba(43,64,48,0.18); }
  .stamp-item.has-cover img { object-fit: cover; }
  .stamp-total { text-align: center; margin-bottom: 24px; }
  .stamp-total-num { font-family: 'Playfair Display', var(--kr-font), Georgia, serif; font-size: 34px; color: #2b4030; }
  .stamp-total-unit { font-size: 16px; color: #6b7a67; margin-left: 3px; }
  .stamp-total-label { font-size: 12px; color: #6b7a67; }
  .view-mode-toggle { display: flex; position: relative; margin: 0 0 16px 0; background: #e5ece2; border-radius: 10px; padding: 3px; }
  .view-mode-indicator { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px);
    background: #fbf9f3; border-radius: 8px; box-shadow: 0 1px 3px rgba(43,64,48,0.15); will-change: transform; }
  .view-mode-btn { flex: 1; position: relative; z-index: 1; pointer-events: none; font-family: 'EB Garamond', var(--kr-font), Georgia, serif; font-size: 12.5px;
    padding: 7px 0; border-radius: 8px; border: none; background: transparent; color: #6b7a67; cursor: pointer; }
  .view-mode-btn.active { color: #2b4030; font-weight: 600; }
  .view-mode-scroll-overlay { position: absolute; inset: 0; z-index: 2; display: flex;
    overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; opacity: 0.001; }
  .view-mode-scroll-overlay::-webkit-scrollbar { display: none; }
  .view-mode-slot { flex: 0 0 100%; scroll-snap-align: start; }
  .footer-signature { text-align: center; font-family: 'EB Garamond', var(--kr-font), Georgia, serif;
    font-size: 11px; font-style: italic; color: #a9baa4; margin: 28px 0 4px 0; letter-spacing: 0.3px; }
  .select-toggle { font-family: 'EB Garamond', var(--kr-font), Georgia, serif; font-size: 13.5px;
    background: none; border: none; color: #6b7a67; text-decoration: underline; cursor: pointer; }
  .select-check { width: 18px; height: 18px; flex-shrink: 0; accent-color: #3f5a45; }
  .select-bar { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #2b4030; color: #fff; padding: 10px 12px 10px 18px; border-radius: 999px; font-size: 13px;
    font-family: 'EB Garamond', var(--kr-font), Georgia, serif;
    display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.25); z-index: 100; }
  .select-bar button { font-family: 'EB Garamond', var(--kr-font), Georgia, serif; font-size: 13px; cursor: pointer; border: none; border-radius: 999px; padding: 7px 14px; }
  .select-bar .cancel-btn { background: transparent; color: #c9e0c0; }
  .select-bar .confirm-btn { background: #c98a72; color: #fff; }

  @media (min-width: 700px) {
    .wrap { max-width: 720px; padding: 36px 32px 60px 32px; }
    .whale-icon { width: 60px; }
    .eyebrow { font-size: 13px; }
    h1 { font-size: 38px; }
    .count-card { padding: 14px 16px; }
    .count-num { font-size: 26px; }
    .count-label { font-size: 13px; }
    .tab-btn, .status-btn { font-size: 15px; padding: 9px 16px; }
    .add-btn { font-size: 18px; padding: 14px; }
    .book-row { padding: 16px 18px; gap: 16px; }
    .spine { width: 12px; height: 54px; }
    .cover-thumb { width: 42px; height: 54px; }
    .book-title { font-size: 19px; }
    .book-author, .book-line { font-size: 14px; }
    .stars span { font-size: 20px; }
    .stars.small span { font-size: 14px; }
    .field-label { font-size: 13.5px; }
    .field input, .field textarea { font-size: 15.5px; padding: 11px 13px; }
    .wish-row { padding: 16px 18px; gap: 16px; }
    .wish-num { font-size: 16px; width: 24px; }
    .wish-cover { width: 42px; height: 54px; }
    .wish-title { font-size: 19px; }
    .wish-author { font-size: 14px; }
  }
  .wish-list { background: #fbf9f3; border-radius: 14px; border: 1px solid #d8e0d2; overflow: hidden; }
  .wish-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; border-bottom: 1px solid #eef2ea; }
  .wish-row:last-child { border-bottom: none; }
  .wish-cover { width: 34px; height: 44px; object-fit: cover; border-radius: 4px; flex-shrink: 0; background: #e5ece2; }
  .wish-num { font-family: 'Playfair Display', var(--kr-font), Georgia, serif; font-size: 14px; color: #8fae86; width: 20px; flex-shrink: 0; }
  .wish-title { font-family: 'Playfair Display', var(--kr-font), Georgia, serif; font-size: 16px; font-weight: 500; color: #2f3b2f; }
  .wish-author { font-size: 11.5px; color: #6b7a67; margin-top: 1px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #2b4030; color: #fff; padding: 12px 18px; border-radius: 999px; font-size: 13px;
    font-family: 'EB Garamond', var(--kr-font), Georgia, serif;
    display: flex; align-items: center; gap: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.25); z-index: 100; }
  .toast button { background: transparent; border: none; color: #c9e0c0; font-weight: 600; cursor: pointer;
    font-size: 13px; font-family: 'EB Garamond', var(--kr-font), Georgia, serif; }
  .trash-link { display: block; text-align: center; font-size: 12px; color: #8fae86; margin: 6px 0 14px 0;
    background: none; border: none; cursor: pointer; text-decoration: underline;
    font-family: 'EB Garamond', var(--kr-font), Georgia, serif; }
  .trash-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #eef2ea; }
  .trash-row:last-child { border-bottom: none; }
  .trash-title { flex: 1; font-size: 13.5px; color: #6b7a67; font-family: 'EB Garamond', var(--kr-font), Georgia, serif; }
  .trash-restore { font-size: 12px; padding: 5px 10px; border-radius: 999px; border: 1px solid #3f5a45;
    background: transparent; color: #3f5a45; cursor: pointer;
    font-family: 'EB Garamond', var(--kr-font), Georgia, serif; }
  .trash-header { display: flex; justify-content: flex-end; margin-bottom: 6px; }
  .trash-empty-btn { font-size: 12px; padding: 5px 10px; border-radius: 999px; border: 1px solid #c98a72;
    background: transparent; color: #c98a72; cursor: pointer;
    font-family: 'EB Garamond', var(--kr-font), Georgia, serif; }
</style>

  document.body.insertBefore(banner, document.body.firstChild);
  window.addEventListener('error', function(ev){
    banner.style.display = 'block';
    banner.textContent = '스크립트 오류: ' + ev.message + ' (줄 ' + ev.lineno + ')';
  });
  window.addEventListener('unhandledrejection', function(ev){
    banner.style.display = 'block';

<script>
const STORAGE_KEY = "forest-shelf-books";
// 이 기기에서 로그인한 적이 있는지 (오프라인 사용 허용 기준)
const LAST_UID_KEY = "forest-shelf-last-uid";
// 기기에서 마지막으로 수정한 시각 (오프라인 수정분 보존용)
const LOCAL_UPDATED_KEY = "forest-shelf-local-updated";
let offlineMode = false;

let currentUid = null;
let unsubscribeSnapshot = null;

function setSyncStatus(text) {
  const el = document.getElementById("syncStatus");
  if (el) el.textContent = text;
}

// 기기에서 수정이 일어난 시각을 기록 (오프라인 수정분을 지키기 위해 사용)
function markLocalEdit() {
  try { localStorage.setItem(LOCAL_UPDATED_KEY, String(Date.now())); } catch (e) {}
}

function getLocalUpdated() {
  try { return Number(localStorage.getItem(LOCAL_UPDATED_KEY) || 0); } catch (e) { return 0; }
}

function pushToFirestore() {
  if (!firebaseReady || offlineMode || !currentUid) {
    if (offlineMode) setSyncStatus("오프라인 — 연결되면 자동 동기화돼요");
    return;
  }
  db.collection("users").doc(currentUid).set({ books: books, trash: trash, updatedAt: Date.now() })
    .then(() => setSyncStatus("동기화됨 ✓"))
    .catch(e => { console.error("push failed", e); setSyncStatus("동기화 실패 (오프라인?)"); });
}

function attachFirestoreSync(uid) {
  const docRef = db.collection("users").doc(uid);
  unsubscribeSnapshot = docRef.onSnapshot(snap => {
    if (openId !== null) return; // don't disrupt an open edit
    if (snap.exists) {
      const data = snap.data() || {};
      const serverUpdated = Number(data.updatedAt || 0);
      const localUpdated = getLocalUpdated();

      // 오프라인에서 고친 내용이 서버보다 최신이면, 덮어쓰지 않고 내 기기 내용을 올림
      if (localUpdated && localUpdated > serverUpdated) {
        setSyncStatus("오프라인 수정분 올리는 중...");
        pushToFirestore();
        return;
      }

      books = Array.isArray(data.books) ? data.books.map(normalizeBook) : books;
      trash = Array.isArray(data.trash) ? data.trash.map(normalizeBookSafe) : trash;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(books)); } catch (e) {}
      try { localStorage.setItem(TRASH_KEY, JSON.stringify(trash)); } catch (e) {}
      try { localStorage.setItem(LOCAL_UPDATED_KEY, String(serverUpdated)); } catch (e) {}
      render();
      setSyncStatus("동기화됨 ✓");
    } else {
      pushToFirestore();
    }
  }, err => {
    console.error("sync error", err);
    setSyncStatus("동기화 오류");
  });
}

function detachFirestoreSync() {
  if (unsubscribeSnapshot) { unsubscribeSnapshot(); unsubscribeSnapshot = null; }
}

if (firebaseReady) {
  auth.getRedirectResult().catch(e => {
    console.error("redirect result error", e);
    const errEl = document.getElementById("authError");
    if (errEl) errEl.textContent = "로그인에 실패했어요. 다시 시도해주세요.";
  });
  auth.onAuthStateChanged(user => {
    const loginScreen = document.getElementById("loginScreen");
    const appRoot = document.getElementById("appRoot");
    if (user) {
      currentUid = user.uid;
      offlineMode = false;
      try { localStorage.setItem(LAST_UID_KEY, user.uid); } catch (e) {}
      loginScreen.style.display = "none";
      appRoot.style.display = "block";
      setSyncStatus("동기화 중...");
      attachFirestoreSync(user.uid);
    } else {
      currentUid = null;
      offlineMode = false;
      detachFirestoreSync();
      // 로그인되지 않은 상태에서는 기기에 남은 기록을 비워 노출을 막음
      try { localStorage.removeItem(LAST_UID_KEY); } catch (e) {}
      try { localStorage.removeItem(LOCAL_UPDATED_KEY); } catch (e) {}
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      try { localStorage.removeItem(TRASH_KEY); } catch (e) {}
      books = [];
      trash = [];
      openId = null;
      try { render(); } catch (e) {}
      loginScreen.style.display = "flex";
      appRoot.style.display = "none";
    }
  });
} else {
  // 인터넷 연결 실패: 이 기기에서 이미 로그인한 적이 있을 때만 오프라인으로 열어줌
  setTimeout(function () {
    let lastUid = null;
    try { lastUid = localStorage.getItem(LAST_UID_KEY); } catch (e) {}

    if (lastUid) {
      offlineMode = true;
      currentUid = lastUid;
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("appRoot").style.display = "block";

const TRASH_KEY = "forest-shelf-trash";
const RATING_SPINE_COLORS = ["#f0e6da", "#eccdb8", "#e3ac8f", "#d88f6b", "#c9724a", "#b0562f"];
function spineColorFor(book) { return RATING_SPINE_COLORS[book.rating || 0]; }
const STATUSES = ["읽고 싶은 책", "읽는 중", "읽은 책"];
const TABS = ["전체", ...STATUSES];

function normalizeBook(b) {
  return {
    id: b.id != null ? b.id : Date.now() + Math.random(),
    seq: b.seq != null ? b.seq : 0,
    title: b.title || "",
    author: b.author || "",
    status: STATUSES.includes(b.status) ? b.status : "읽고 싶은 책",
    rating: Number.isFinite(b.rating) ? b.rating : 0,
    line: b.line || "",
    thoughts: b.thoughts || "",
    quote: b.quote || "",
    readMonth: b.readMonth || "",
    cover: b.cover || "",
    spine: b.spine || 0
  };
}

function normalizeBookSafe(b) {
  try { return normalizeBook(b); } catch (e) { return b; }
}

function loadTrash() {
  try {
    const raw = localStorage.getItem(TRASH_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed.map(normalizeBookSafe);
    }
  } catch (e) { console.error("loadTrash failed", e); }
  return [];
}

let trash = loadTrash();
function saveTrash() {
  try { localStorage.setItem(TRASH_KEY, JSON.stringify(trash)); }
  catch (e) { console.error("saveTrash failed", e); alert("저장 공간이 부족해서 휴지통 저장에 실패했어요. 휴지통을 비워보세요."); }
  markLocalEdit();
  pushToFirestore();
}

function restoreFromTrash(id) {

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

// 속성값(value="...", src="...", title="...") 안에 넣을 때 사용.
// escapeHtml은 따옴표를 이스케이프하지 않아 속성 컨텍스트에서는 안전하지 않음.
function escapeAttr(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 이미지 주소로 쓸 수 있는 형태인지 확인 (javascript: 등 차단)
function safeImageSrc(str) {
  const s = String(str == null ? "" : str).trim();
  if (/^(https?:\/\/|data:image\/)/i.test(s)) return escapeAttr(s);
  return "";
}

function starsHtml(rating, readOnly, bookId) {
  let html = '<div class="stars' + (readOnly ? ' small' : '') + '">';
  for (let n = 1; n <= 5; n++) {
    const filled = n <= rating ? " filled" : "";
    if (readOnly) {
      html += '<span class="' + filled.trim() + '">★</span>';
    } else {
      html += '<span class="' + filled.trim() + '" data-book="' + bookId + '" data-rate="' + n + '">★</span>';
    }
  }
  html += "</div>";
  return html;
}

let toggleSyncLock = false;

function updateAddButtonVisibility() {
  const isStamp = currentTab === "전체" && viewMode === "스탬프";
  const addBtn = document.getElementById("addBtn");
  const listActions = document.getElementById("listActions");

function goToViewMode(mode) {
  viewMode = mode;
  const container = document.getElementById("swipeContainer");
  const overlay = document.getElementById("viewModeScrollOverlay");
  const indicator = document.getElementById("viewModeIndicator");
  const idx = mode === "목록" ? 1 : 0;

  if (!container) { render(); return; }

  toggleSyncLock = true;
  container.scrollTo({ left: idx * container.clientWidth, behavior: "smooth" });
  if (overlay) overlay.scrollLeft = idx * overlay.clientWidth;
  if (indicator) indicator.style.transform = "translateX(" + (mode === "목록" ? "100%" : "0%") + ")";
  document.querySelectorAll(".view-mode-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.view === mode);
  });
  updateAddButtonVisibility();
  setTimeout(() => { toggleSyncLock = false; }, 400);
}

function renderViewModeToggle() {
  const el = document.getElementById("viewModeToggle");
  if (currentTab !== "전체") { el.innerHTML = ""; return; }
  el.innerHTML =
    '<div class="view-mode-toggle" id="viewModeToggleBar">' +
      '<div class="view-mode-indicator" id="viewModeIndicator"></div>' +
      '<button class="view-mode-btn' + (viewMode === "스탬프" ? " active" : "") + '" data-view="스탬프">스탬프</button>' +
      '<button class="view-mode-btn' + (viewMode === "목록" ? " active" : "") + '" data-view="목록">목록</button>' +
      '<div class="view-mode-scroll-overlay" id="viewModeScrollOverlay">' +
        '<div class="view-mode-slot" data-view="스탬프"></div>' +
        '<div class="view-mode-slot" data-view="목록"></div>' +
      '</div>' +
    '</div>';

  const indicator = document.getElementById("viewModeIndicator");
  indicator.style.transform = "translateX(" + (viewMode === "목록" ? "100%" : "0%") + ")";

  const overlay = document.getElementById("viewModeScrollOverlay");
  overlay.scrollLeft = (viewMode === "목록" ? 1 : 0) * overlay.clientWidth;

  let overlaySyncing = false;
  overlay.addEventListener("scroll", () => {
    if (toggleSyncLock) return;
    const maxScroll = overlay.scrollWidth - overlay.clientWidth;
    const progress = maxScroll > 0 ? Math.min(1, Math.max(0, overlay.scrollLeft / maxScroll)) : 0;
    indicator.style.transform = "translateX(" + (progress * 100) + "%)";
    document.querySelectorAll(".view-mode-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.view === (progress < 0.5 ? "스탬프" : "목록"));
    });

    const container = document.getElementById("swipeContainer");
    if (container) {
      toggleSyncLock = true;
      container.scrollLeft = progress * (container.scrollWidth - container.clientWidth);
      toggleSyncLock = false;
    }

    clearTimeout(overlay._settleTimer);
    overlay._settleTimer = setTimeout(() => {
      const idx = Math.round(overlay.scrollLeft / overlay.clientWidth);
      viewMode = idx === 0 ? "스탬프" : "목록";
      updateAddButtonVisibility();
    }, 80);
  });

  let downX = 0, downY = 0, dragged = false;
  overlay.addEventListener("pointerdown", (e) => { downX = e.clientX; downY = e.clientY; dragged = false; });
  overlay.addEventListener("pointermove", (e) => {
    if (Math.abs(e.clientX - downX) > 8 || Math.abs(e.clientY - downY) > 8) dragged = true;
  });
  overlay.querySelectorAll(".view-mode-slot").forEach(slot => {
    slot.addEventListener("click", () => {
      if (dragged) return;
      goToViewMode(slot.dataset.view);
    });
  });

  document.querySelectorAll(".view-mode-btn").forEach(btn => {
    btn.style.pointerEvents = "none";
  });
}

      books = data.books.map(normalizeBook);

function renderAllTabSwipeable(el) {

    ? '<div class="empty">' + (searchQuery.trim() ? "검색 결과가 없어요." : "아직 이 서가에는 책이 없어요.") + '</div>'

    '</div>';

  attachBookEvents();
  renderSelectBar();

  const container = document.getElementById("swipeContainer");
  const targetIndex = viewMode === "목록" ? 1 : 0;
  container.scrollLeft = targetIndex * container.clientWidth;
  const initMax = container.scrollWidth - container.clientWidth;
  const initProgress = initMax > 0 ? Math.min(1, Math.max(0, container.scrollLeft / initMax)) : 0;
  const initIndicator = document.getElementById("viewModeIndicator");
  if (initIndicator) initIndicator.style.transform = "translateX(" + (initProgress * 100) + "%)";

  let scrollTimer;
  container.addEventListener("scroll", () => {
    if (toggleSyncLock) return;
    const maxScroll = container.scrollWidth - container.clientWidth;
    const progress = maxScroll > 0 ? Math.min(1, Math.max(0, container.scrollLeft / maxScroll)) : 0;
    const indicator = document.getElementById("viewModeIndicator");
    if (indicator) indicator.style.transform = "translateX(" + (progress * 100) + "%)";

    const closerMode = progress < 0.5 ? "스탬프" : "목록";
    document.querySelectorAll(".view-mode-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.view === closerMode);
    });

    const overlay = document.getElementById("viewModeScrollOverlay");
    if (overlay) {
      toggleSyncLock = true;
      overlay.scrollLeft = progress * (overlay.scrollWidth - overlay.clientWidth);
      toggleSyncLock = false;
    }

    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      const idx = Math.round(container.scrollLeft / container.clientWidth);
      const newMode = idx === 0 ? "스탬프" : "목록";
      if (newMode !== viewMode) viewMode = newMode;
      updateAddButtonVisibility();
    }, 80);
  });
}

const MONTH_TAG_PALETTE = [
  { bg: "#e3ecdd", fg: "#4f6b47" },  // sage
  { bg: "#f0ddd3", fg: "#a85f3f" },  // rose/terracotta
  { bg: "#e8e1f0", fg: "#6f5a94" },  // lavender
  { bg: "#f3e6c9", fg: "#9c7a2c" },  // sand/gold
  { bg: "#dbe8ec", fg: "#3f7288" },  // muted blue
  { bg: "#f0dde4", fg: "#a5537a" },  // dusty pink
];

function monthTagStyle(key) {
  if (!key) return { bg: "#e9e9e9", fg: "#8a8a8a" };
  let hash = 0;
  for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
  return MONTH_TAG_PALETTE[hash % MONTH_TAG_PALETTE.length];
}

function renderBooksHtml(visible) {
  return visible.map((book, i) => bookCardHtml(book, i, visible.length)).join("");
}

function buildStampHtml() {
  const stamped = books.filter(b => b.status === "읽은 책" && b.readMonth);

  if (stamped.length === 0) {
    return '<div class="empty">아직 읽은 시기를 기록한 책이 없어요.<br>책 상세화면에서 "읽은 시기"를 입력해보세요.</div>';
  }

  const groups = new Map();
  stamped.forEach(book => {
    const key = book.readMonth;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(book);
  });
  const keys = [...groups.keys()].sort((a, b) => b.localeCompare(a));

  const totalHtml =
    '<div class="stamp-total">' +
      '<div class="stamp-total-num">' + stamped.length + '<span class="stamp-total-unit">권</span></div>' +
      '<div class="stamp-total-label">지금까지 읽은 책</div>' +
    '</div>';

  const groupsHtml = keys.map(key => {
    const list = groups.get(key);
    const stampsHtml = list.map(book => {
      const cover = safeImageSrc(book.cover);
      const alt = escapeAttr(book.title || "제목 없는 책");
      if (cover) {
        return '<div class="stamp-item has-cover" title="' + alt + '"><img src="' + cover + '" alt="" /></div>';
      }
      return '<div class="stamp-item" title="' + alt + '"><img src="' + WHALE_STAMP_SRC + '" alt="" /></div>';
    }).join("");
    return '<div class="stamp-month-group">' +
      '<div class="stamp-month-label">' + formatReadMonth(key) + '<span class="stamp-month-count">' + list.length + '권</span></div>' +
      '<div class="stamp-row">' + stampsHtml + '</div>' +
    '</div>';
  }).join("");

  return totalHtml + groupsHtml;
}

function renderWishList(el) {
  const wish = books.filter(b => b.status === "읽고 싶은 책");
  const numbered = wish.map((book, i) => ({ book, num: wish.length - i }));
  const visible = numbered.filter(({ book }) => matchesSearch(book));

  if (wish.length === 0) {
    el.innerHTML = '<div class="empty">읽고 싶은 책이 아직 없어요.</div>';
    renderSelectBar();
    return;
  }
  if (visible.length === 0) {
    el.innerHTML = '<div class="empty">검색 결과가 없어요.</div>';
    renderSelectBar();
    return;
  }
  el.innerHTML = '<div class="wish-list">' + visible.map(({ book, num }) =>
    '<div class="wish-row" data-wish="' + book.id + '">' +
      (selectMode ? '<input type="checkbox" class="select-check" data-select="' + book.id + '"' + (selectedIds.has(book.id) ? ' checked' : '') + ' />' : '') +
      '<div class="wish-num">' + num + '</div>' +
      '<div class="spine" style="background:' + spineColorFor(book) + '"></div>' +
      (safeImageSrc(book.cover) ? '<img class="wish-cover" src="' + safeImageSrc(book.cover) + '" alt="" />' : '<div class="wish-cover"></div>') +
      '<div class="row-main">' +
        '<div class="wish-title">' + (escapeHtml(book.title) || "제목 없는 책") + '</div>' +
        (book.author ? '<div class="wish-author">' + escapeHtml(book.author) + '</div>' : '') +
      '</div>' +
      '<span class="chevron">›</span>' +
    '</div>'
  ).join("") + '</div>';

  el.querySelectorAll("[data-wish]").forEach(row => {
    row.addEventListener("click", (e) => {
      const id = Number(row.dataset.wish);
      if (selectMode) {
        if (e.target.matches("[data-select]")) return;
        toggleSelect(id);
        return;
      }
      const book = books.find(b => b.id === id);
      if (book) {
        book.status = "읽는 중";
        saveBooks();
        currentTab = "읽는 중";
        openId = id;
        render();
      }
    });
  });

  el.querySelectorAll("[data-select]").forEach(cb => {
    cb.addEventListener("click", e => e.stopPropagation());
    cb.addEventListener("change", () => toggleSelect(Number(cb.dataset.select)));
  });

  renderSelectBar();
}

function buildMonthSelects(book) {
  const [selY, selM] = (book.readMonth || "").split("-");
  const curYear = new Date().getFullYear();
  let yearOpts = '<option value="">연도</option>';
  for (let y = curYear + 1; y >= curYear - 12; y--) {
    yearOpts += '<option value="' + y + '"' + (String(y) === selY ? ' selected' : '') + '>' + y + '</option>';
  }
  let monthOpts = '<option value="">월</option>';
  for (let m = 1; m <= 12; m++) {
    const mm = String(m).padStart(2, "0");
    monthOpts += '<option value="' + mm + '"' + (mm === selM ? ' selected' : '') + '>' + m + '월</option>';
  }
  return '<div class="month-select-group">' +
    '<select class="month-pill" data-read-year="' + book.id + '">' + yearOpts + '</select>' +
    '<select class="month-pill" data-read-month-part="' + book.id + '">' + monthOpts + '</select>' +
  '</div>';
}

function formatReadMonth(v) {
  if (!v) return "";
  const [y, m] = v.split("-");
  if (!y || !m) return "";
  return y + "년 " + Number(m) + "월";
}

function bookCardHtml(book, index, total, globalNum) {
  const spineColor = spineColorFor(book);
  const isOpen = openId === book.id;
  const coverImg = safeImageSrc(book.cover) ? '<img class="cover-thumb" src="' + safeImageSrc(book.cover) + '" alt="" />' : '<div class="cover-thumb"></div>';
  const readMonthText = formatReadMonth(book.readMonth);
  const authorLine = book.author ? '<div class="book-author">' + escapeHtml(book.author) + '</div>' : "";
  const lineHtml = book.line ? '<div class="book-line">' + escapeHtml(book.line) + '</div>' : "";
  const ratingBadge = book.rating > 0 ? starsHtml(book.rating, true) : "";
  const monthTag = readMonthText
    ? '<div class="row-month-tag" style="border-left-color:' + monthTagStyle(book.readMonth).fg + ';background:' + monthTagStyle(book.readMonth).bg + '77;color:' + monthTagStyle(book.readMonth).fg + ';">' + readMonthText + '</div>'
    : "";
  const ratingCol = (ratingBadge || monthTag)
    ? '<div class="rating-col">' + monthTag + ratingBadge + '</div>'
    : "";
  const num = globalNum != null ? globalNum : ((index != null && total != null) ? (total - index) : null);

  return '<div class="book-card">' +
    '<div class="book-row" data-toggle="' + book.id + '">' +
      (selectMode ? '<input type="checkbox" class="select-check" data-select="' + book.id + '"' + (selectedIds.has(book.id) ? ' checked' : '') + ' />' : '') +
      (num != null ? '<div class="wish-num">' + num + '</div>' : '') +
      '<div class="spine" style="background:' + spineColor + '"></div>' +
      coverImg +
      '<div class="row-main">' +
        '<div class="book-title">' + (escapeHtml(book.title) || "제목 없는 책") + '</div>' +
        authorLine +
        lineHtml +
      '</div>' +
      ratingCol +
      '<span class="chevron' + (isOpen ? ' open' : '') + '">›</span>' +
    '</div>' +
    '<div class="detail' + (isOpen && !selectMode ? ' open' : '') + '">' +
      '<div class="field"><div class="field-label">책 제목</div>' +
        '<input type="text" data-field="title" data-book="' + book.id + '" value="' + escapeAttr(book.title) + '" placeholder="책 제목을 입력하세요" /></div>' +
      '<div class="field"><div class="field-label">저자</div>' +
        '<input type="text" data-field="author" data-book="' + book.id + '" value="' + escapeAttr(book.author || "") + '" placeholder="저자명을 입력하세요" /></div>' +
      '<div class="field"><div class="field-label">책 커버</div>' +
        '<div class="cover-input-row">' +
          '<input type="text" data-field="cover" data-book="' + book.id + '" value="' + (book.cover && !book.cover.startsWith("data:") ? escapeAttr(book.cover) : "") + '" placeholder="이미지 URL 붙여넣기" />' +
          '<label class="upload-btn">사진 첨부<input type="file" accept="image/*" data-cover-upload="' + book.id + '" style="display:none" /></label>' +
        '</div>' +
        (safeImageSrc(book.cover) ? '<img class="cover-preview" src="' + safeImageSrc(book.cover) + '" alt="" />' : '') +
      '</div>' +
      '<div class="field"><div class="field-label">읽음 상태</div><div class="status-row">' +
        STATUSES.map(s =>
          '<button class="status-btn' + (book.status === s ? ' active' : '') + '" data-book="' + book.id + '" data-status="' + s + '">' + s + '</button>'
        ).join("") +
      '</div></div>' +
      '<div class="field rating-month-row">' +
        '<div class="rating-month-box">' +
          '<div class="field-label">별점</div>' +
          starsHtml(book.rating, false, book.id) +
        '</div>' +
        '<div class="rating-month-box">' +
          '<div class="field-label">읽은 시기</div>' +
          buildMonthSelects(book) +
        '</div>' +
      '</div>' +
      '<div class="field"><div class="field-label">한줄 기록</div>' +
        '<input type="text" data-field="line" data-book="' + book.id + '" value="' + escapeAttr(book.line) + '" placeholder="이 책을 한 문장으로 표현하면" /></div>' +
      '<div class="field"><div class="field-label">생각의 여백</div>' +
        '<textarea data-field="thoughts" data-book="' + book.id + '" placeholder="이 책이 남긴 질문이나 생각">' + escapeHtml(book.thoughts) + '</textarea></div>' +
      '<div class="field"><div class="field-label">마음에 남은 문장들</div>' +
        '<textarea data-field="quote" data-book="' + book.id + '" placeholder="마음에 남은 문장을 옮겨 적어보세요">' + escapeHtml(book.quote || "") + '</textarea></div>' +
      '<div class="save-row">' +
        '<button class="save-btn" data-save="' + book.id + '">저장</button>' +
        '<span class="save-status" id="save-status-' + book.id + '"></span>' +
      '</div>' +
      '<button class="delete-link" data-delete="' + book.id + '">이 기록 삭제</button>' +
    '</div>' +
  '</div>';
}

function autoGrowTextarea(el) {
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}

function attachBookEvents() {
  document.querySelectorAll("[data-toggle]").forEach(row => {
    row.addEventListener("click", (e) => {
      const id = Number(row.dataset.toggle);
      if (selectMode) {
        if (e.target.matches("[data-select]")) return;
        toggleSelect(id);
        return;
      }
      openId = openId === id ? null : id;
      render();
    });
  });

  document.querySelectorAll(".book-row [data-select]").forEach(cb => {
    cb.addEventListener("click", e => e.stopPropagation());
    cb.addEventListener("change", () => toggleSelect(Number(cb.dataset.select)));
  });

  document.querySelectorAll("input[data-field], textarea[data-field]").forEach(input => {
    input.addEventListener("click", e => e.stopPropagation());
    if (input.tagName === "TEXTAREA") autoGrowTextarea(input);
    input.addEventListener("input", () => {
      const id = Number(input.dataset.book);
      const field = input.dataset.field;
      const book = books.find(b => b.id === id);
      if (book) {
        book[field] = input.value;
        const statusEl = document.getElementById("save-status-" + id);
        if (statusEl) statusEl.textContent = "저장 안 된 변경사항 있음";
      }
      if (input.tagName === "TEXTAREA") autoGrowTextarea(input);
    });
  });

  document.querySelectorAll("[data-save]").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const id = Number(btn.dataset.save);
      const book = books.find(b => b.id === id);
      saveBooks();
      openId = null;
      currentTab = "전체";
      render();
      if (book) showSavedToast(book);
    });
  });

  document.querySelectorAll("[data-read-year], [data-read-month-part]").forEach(sel => {
    sel.addEventListener("click", e => e.stopPropagation());
    sel.addEventListener("change", () => {
      const id = Number(sel.dataset.readYear || sel.dataset.readMonthPart);
      const book = books.find(b => b.id === id);
      if (!book) return;
      const card = sel.closest(".book-card");
      const yearSel = card.querySelector("[data-read-year]");
      const monthSel = card.querySelector("[data-read-month-part]");
      const y = yearSel.value;
      const m = monthSel.value;
      book.readMonth = (y && m) ? (y + "-" + m) : "";
      const statusEl = document.getElementById("save-status-" + id);
      if (statusEl) statusEl.textContent = "저장 안 된 변경사항 있음";
    });
  });

  document.querySelectorAll("[data-cover-upload]").forEach(input => {
    input.addEventListener("click", e => e.stopPropagation());
    input.addEventListener("change", () => {
      const id = Number(input.dataset.coverUpload);
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const book = books.find(b => b.id === id);
        if (book) {
          book.cover = reader.result;
          render();
          const statusEl = document.getElementById("save-status-" + id);
          if (statusEl) statusEl.textContent = "저장 안 된 변경사항 있음";
        }
      };
      reader.readAsDataURL(file);
    });
  });

  document.querySelectorAll(".status-btn").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const id = Number(btn.dataset.book);
      const book = books.find(b => b.id === id);
      if (book) {
        book.status = btn.dataset.status;
        render();
        const statusEl = document.getElementById("save-status-" + id);
        if (statusEl) statusEl.textContent = "저장 안 된 변경사항 있음";
      }
    });
  });

  document.querySelectorAll(".stars span[data-book]").forEach(star => {
    star.addEventListener("click", e => {
      e.stopPropagation();
      const id = Number(star.dataset.book);
      const rate = Number(star.dataset.rate);
      const book = books.find(b => b.id === id);
      if (book) {
        book.rating = book.rating === rate ? 0 : rate;
        render();
        const statusEl = document.getElementById("save-status-" + id);
        if (statusEl) statusEl.textContent = "저장 안 된 변경사항 있음";
      }
    });
  });

  document.querySelectorAll("[data-delete]").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const id = Number(btn.dataset.delete);
      const idx = books.findIndex(b => b.id === id);
      if (idx === -1) return;
      const [removed] = books.splice(idx, 1);
      trash.unshift(removed);
      if (openId === id) openId = null;
      saveBooks();
      saveTrash();
      render();
      showUndoToast(removed);
    });
  });
}

document.getElementById("trashLink").addEventListener("click", () => {
  trashOpen = !trashOpen;
  renderTrashLink();
  renderTrashList();
});

document.getElementById("addBtn").addEventListener("click", () => {
  const id = Date.now();
  books.unshift({ id, seq: nextSeq(), title: "", author: "", status: "읽고 싶은 책", rating: 0, line: "", thoughts: "", quote: "", readMonth: "", cover: "", spine: books.length });
  openId = id;
  currentTab = "전체";
  saveBooks();
  render();
});

render();

document.getElementById("googleLoginBtn").addEventListener("click", () => {
  const errEl = document.getElementById("authError");
  errEl.textContent = "";
  if (!firebaseReady) { errEl.textContent = "로그인 서비스에 연결할 수 없어요. (firebaseReady=false)"; return; }
  try {
    auth.signInWithPopup(googleProvider).catch(e => {
      console.error(e);
      errEl.textContent = "로그인 실패: " + (e && (e.code || e.message) || String(e));
    });
  } catch (e) {
    console.error(e);
    errEl.textContent = "로그인 오류(동기): " + (e && e.message ? e.message : String(e));
  }
});

window.addEventListener("error", (ev) => {
  const errEl = document.getElementById("authError");
  if (errEl) errEl.textContent = "스크립트 오류: " + ev.message;
});

document.getElementById("logoutBtn").addEventListener("click", () => {
  if (!confirm("로그아웃할까요? 이 기기에 저장된 일지 데이터도 함께 지워져요.")) return;

  const clearLocal = () => {
    try { localStorage.removeItem(LAST_UID_KEY); } catch (e) {}
    try { localStorage.removeItem(LOCAL_UPDATED_KEY); } catch (e) {}
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    try { localStorage.removeItem(TRASH_KEY); } catch (e) {}
    books = [];
    trash = [];
    openId = null;
    currentUid = null;
    offlineMode = false;
    currentTab = "전체";
    try { render(); } catch (e) {}
    document.getElementById("loginScreen").style.display = "flex";
    document.getElementById("appRoot").style.display = "none";
  };

  if (firebaseReady && auth) {
    auth.signOut().then(clearLocal).catch(clearLocal);
  } else {
    clearLocal();
  }
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
