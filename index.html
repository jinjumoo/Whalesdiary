<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>고래의 하루</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="고래의 하루">
<meta name="theme-color" content="#FFFBEF">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=EB+Garamond:wght@400;500;600&family=Song+Myung&display=swap');

  :root{
    --bg: #FFFBEF;
    --bg-deep: #FFF3D2;
    --card: #FFFBEF;
    --yolk: #FFE3A3;
    --yolk-soft: #FFF0C8;
    --yolk-deep: #BFAF9B;
    --ink: #766C60;
    --ink-soft: #BFAF9B;
    --line: #E7DCC6;
    --shadow: rgba(0,0,0,0);
    --whale: #766C60;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html{ overflow-x: hidden; }
  body{
    font-family: 'EB Garamond', 'Song Myung', Georgia, serif;
    background: var(--bg);
    min-height: 100vh;
    color: var(--ink);
    padding-bottom: 40px;
    overflow-x: hidden;
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    padding-bottom: max(40px, env(safe-area-inset-bottom));
  }

  .wrap{
    max-width: 480px;
    width: 100%;
    margin: 0 auto;
    padding: clamp(20px, 8vw, 40px) clamp(14px, 5vw, 24px) 20px;
  }
  @media (min-width: 700px){
    .wrap{ max-width: 640px; }
  }
  @media (min-width: 1100px){
    .wrap{ max-width: 720px; }
  }
  @media (min-width: 1400px){
    .wrap{ max-width: 820px; }
  }

  /* Header */
  header{ margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; }
  .logo-mark{
    width: 40px;
    height: auto;
    flex-shrink: 0;
    opacity: 0.75;
  }
  .header-text{ flex: 1; }
  h1{
    font-family: 'Playfair Display', 'Song Myung', Georgia, serif;
    font-weight: 700;
    font-size: clamp(22px, 6vw, 28px);
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .sub{
    font-size: clamp(11.5px, 3vw, 12.5px);
    color: var(--ink-soft);
    margin-top: 4px;
    font-family: 'Playfair Display', 'Song Myung', Georgia, serif;
    font-style: italic;
  }

  /* Streak / stat bar */
  .stat-row{
    display:flex; gap:0; margin: 0 0 28px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .stat{
    flex:1;
    padding: 14px 6px;
    text-align:center;
    border-right: 1px solid var(--line);
  }
  .stat:last-child{ border-right: none; }
  .stat .num{ font-family:'Playfair Display','Song Myung',Georgia,serif; font-size:19px; font-weight:700; color: var(--ink); }
  .stat .lab{ font-size: 10.5px; color: var(--ink-soft); margin-top:3px; letter-spacing: 0.02em; }

  /* New entry button */
  .new-btn{
    width: 100%;
    background: transparent;
    border: 1px solid var(--ink);
    border-radius: 2px;
    padding: 14px;
    font-family: 'Playfair Display', 'Song Myung', Georgia, serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    margin-bottom: 32px;
    letter-spacing: 0.02em;
  }
  .new-btn:active{ background: var(--bg-deep); }

  /* Tab bar */
  .tab-bar{
    display: flex;
    gap: 6px;
    padding-left: 4px;
    position: relative;
    z-index: 1;
  }
  .tab-btn{
    background: transparent;
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 12px 12px 0 0;
    padding: 10px 20px 12px;
    font-family: 'Playfair Display', 'Song Myung', Georgia, serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    position: relative;
    top: 1px;
  }
  .tab-btn.active{
    background: var(--yolk-soft);
    border-color: var(--yolk-deep);
    color: var(--ink);
    top: 0;
    padding-bottom: 13px;
  }
  .tab-card{
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 0 14px 14px 14px;
    padding: 22px 18px 18px;
    margin-bottom: 28px;
    position: relative;
    z-index: 0;
  }
  .tab-card .stat-row{ margin: 4px 0 20px; }
  .tab-card .new-btn{ margin-bottom: 4px; }

  /* Calendar */
  .cal-header{
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .cal-title{
    font-family: 'Playfair Display', 'Song Myung', Georgia, serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
  }
  .cal-nav{
    background: transparent;
    border: 1px solid var(--line);
    width: 30px; height: 30px;
    border-radius: 50%;
    font-size: 15px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .cal-weekdays{
    display: flex;
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .cal-weekdays span{ flex: 1 1 0; }
  .cal-grid{
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    align-content: flex-start;
    margin-bottom: 24px;
  }
  .cal-day{
    flex: 0 0 14.2857%;
    width: 14.2857%;
    height: clamp(38px, 11vw, 46px);
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    border-radius: 10px;
    cursor: pointer;
    font-size: clamp(12px, 3.2vw, 13px);
    color: var(--ink);
  }
  .cal-day.cal-blank{ cursor: default; }
  .cal-day.today .day-num{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid var(--ink);
  }
  .cal-day .day-num{ position: relative; z-index: 1; }
  .cal-day .stamp{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cal-day .stamp img{
    width: 78%;
    height: auto;
    opacity: 0.85;
  }
  .cal-day.has-entry .day-num{
    position: absolute;
    top: 2px;
    right: 4px;
    font-size: 9px;
    color: var(--ink-soft);
    width: auto; height: auto; border: none;
  }

  /* Section title */
  .sec-title{
    font-family:'Playfair Display', 'Song Myung', Georgia, serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 4px 0 14px 0;
    letter-spacing: 0.04em;
  }

  /* Mood filter chips */
  .mood-filters{
    display:flex; gap:0; margin-bottom: 22px; overflow-x:auto; padding-bottom:8px;
    border-bottom: 1px solid var(--line);
  }
  .chip{
    flex-shrink:0;
    padding: 4px 14px 4px 0;
    background: transparent;
    border: none;
    font-size: 12.5px;
    color: var(--ink-soft);
    cursor: pointer;
    white-space:nowrap;
    font-family: 'Playfair Display', 'Song Myung', Georgia, serif;
  }
  .chip.active{
    color: var(--ink);
    font-weight:700;
    text-decoration: underline;
    text-underline-offset: 4px;
  }

  /* Entry list */
  .entry-card{
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    padding: 18px 2px 18px;
    margin-bottom: 0;
    cursor: pointer;
    position: relative;
  }
  .entry-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom: 8px;
  }
  .entry-date{
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 500;
    letter-spacing: 0.03em;
  }
  .entry-mood{
    font-size: 17px;
    opacity: 0.85;
  }
  .entry-title{
    font-family: 'Playfair Display', 'Song Myung', Georgia, serif;
    font-size: clamp(15px, 4vw, 17px);
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--ink);
  }
  .entry-preview{
    font-size: clamp(12.5px, 3.2vw, 14px);
    line-height: 1.65;
    color: var(--ink-soft);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .entry-tags{ display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }
  .tag{
    font-size: 11px;
    background: transparent;
    color: var(--ink-soft);
    padding: 0;
    border-radius: 0;
    font-style: italic;
  }

  .empty{
    text-align:center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .empty .logo-mark{ margin: 0 auto 18px; opacity: 0.3; }
  .empty p{ font-size: 13.5px; line-height:1.7; font-family: 'Playfair Display', 'Song Myung', Georgia, serif; }

  /* Trash */
  .trash-link{
    display: block;
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    text-decoration: underline;
    text-underline-offset: 3px;
    background: none;
    border: none;
    cursor: pointer;
    margin: 18px auto 4px;
    font-family: 'EB Garamond', 'Song Myung', Georgia, serif;
  }
  .trash-header{
    display: flex;
    justify-content: flex-end;
    margin-bottom: 8px;
  }
  .trash-empty-btn{
    font-size: 11.5px;
    padding: 5px 12px;
    border-radius: 100px;
    border: 1px solid #D8B4A0;
    background: transparent;
    color: #A5684A;
    cursor: pointer;
    font-family: 'EB Garamond', 'Song Myung', Georgia, serif;
  }
  .trash-row{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 2px;
    border-bottom: 1px solid var(--line);
  }
  .trash-row-main{ flex: 1; min-width: 0; }
  .trash-title{
    font-size: 13.5px;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .trash-date{
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .trash-restore{
    font-size: 11.5px;
    padding: 5px 12px;
    border-radius: 100px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
    font-family: 'EB Garamond', 'Song Myung', Georgia, serif;
  }

  /* Todo */
  .todo-date{
    font-family: 'Playfair Display', 'Song Myung', Georgia, serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 16px;
  }
  .todo-add-row{
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .todo-add-row input{
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 8px 2px;
    font-family: 'EB Garamond', 'Song Myung', Georgia, serif;
    font-size: 14.5px;
    color: var(--ink);
    outline: none;
  }
  .todo-add-row input:focus{ border-bottom-color: var(--ink); }
  .todo-add-btn{
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-size: 17px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .todo-item{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .todo-check{
    width: 21px;
    height: 21px;
    border-radius: 4px;
    border: 1.5px solid var(--ink-soft);
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    background: transparent;
  }
  .todo-check svg{
    width: 16px;
    height: 16px;
    display: none;
  }
  .todo-item.done .todo-check{
    border-color: #C0503C;
  }
  .todo-item.done .todo-check svg{
    display: block;
  }
  .todo-text{
    flex: 1;
    font-size: 14.5px;
    color: var(--ink);
    word-break: break-word;
  }
  .todo-item.done .todo-text{
    color: var(--ink-soft);
    text-decoration: line-through;
  }
  .todo-del{
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 15px;
    cursor: pointer;
    padding: 4px;
    flex-shrink: 0;
  }
  .todo-progress{
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 20px;
    font-family: 'EB Garamond', 'Song Myung', Georgia, serif;
  }

  /* Modal / editor */
  .overlay{
    position: fixed; inset:0;
    background: rgba(74,51,36,0.3);
    display:none;
    align-items:flex-end;
    z-index: 50;
  }
  .overlay.open{ display:flex; }
  .sheet{
    background: var(--bg);
    width:100%;
    max-height: 92vh;
    border-radius: 0;
    border-top: 3px solid var(--ink);
    padding: 24px 24px 28px;
    overflow-y:auto;
  }
  @media (min-width: 700px){
    .overlay{ align-items: center; justify-content: center; }
    .sheet{
      width: 560px;
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 20px;
      border-top: 3px solid var(--ink);
      padding: 32px 32px 36px;
    }
  }

  .sheet-head{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
  }
  .sheet-head h2{
    font-family:'Playfair Display', 'Song Myung', Georgia, serif;
    font-size: 19px;
    font-weight: 700;
  }
  .icon-btn{
    background: transparent;
    border: none;
    width: 30px; height:30px;
    font-size: 17px;
    color: var(--ink-soft);
    cursor:pointer;
  }

  .field-lab{ font-size: 11.5px; color: var(--ink-soft); margin: 16px 0 7px 0; font-weight:600; letter-spacing: 0.03em; }

  .mood-pick{ display:flex; gap:0; border-bottom: 1px solid var(--line); }
  .mood-opt{
    flex:1;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 10px 0;
    text-align:center;
    font-size: 21px;
    cursor:pointer;
    opacity: 0.5;
  }
  .mood-opt.sel{ border-bottom-color: var(--ink); opacity: 1; }

  input[type=text], textarea{
    width:100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    padding: 10px 2px;
    font-family: 'EB Garamond', 'Song Myung', Georgia, serif;
    font-size: 14.5px;
    color: var(--ink);
    outline:none;
  }
  input[type=text]:focus, textarea:focus{ border-bottom-color: var(--ink); }
  textarea{ min-height: 150px; line-height:1.7; resize: vertical; }
  input::placeholder, textarea::placeholder{ color: #C4B392; }

  .tag-input-row{ display:flex; gap:8px; }
  .tag-input-row input{ flex:1; }
  .tag-add{
    background: transparent;
    border: 1px solid var(--ink-soft); border-radius: 0;
    width: 40px;
    font-size: 15px; font-weight:700;
    color: var(--ink);
    cursor:pointer;
  }
  .cur-tags{ display:flex; gap:12px; flex-wrap:wrap; margin-top: 10px; }
  .cur-tag{
    background: transparent;
    color: var(--ink-soft);
    font-size: 12px;
    padding: 0;
    border-radius: 0;
    display:flex; align-items:center; gap:5px;
    font-style: italic;
  }
  .cur-tag span{ cursor:pointer; opacity:0.6; font-weight:700; font-style: normal; }

  .photo-add-btn{
    width: 100%;
    background: transparent;
    border: 1.5px dashed var(--line);
    border-radius: 14px;
    padding: 16px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .photo-preview{
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    border: 1.5px solid var(--line);
  }
  .photo-preview img{
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    display: block;
  }
  .photo-remove-btn{
    position: absolute;
    top: 8px; right: 8px;
    width: 28px; height: 28px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  .entry-photo{
    width: 100%;
    max-height: 160px;
    object-fit: cover;
    border-radius: 12px;
    margin-top: 10px;
  }

  .save-btn{
    width:100%;
    margin-top: 26px;
    background: var(--ink);
    border:none;
    border-radius: 2px;
    padding: 15px;
    font-family:'Playfair Display', 'Song Myung', Georgia, serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--bg);
    cursor:pointer;
    letter-spacing: 0.02em;
  }

  .delete-btn{
    width:100%;
    margin-top: 12px;
    background: transparent;
    border: none;
    padding: 13px;
    font-size: 12.5px;
    font-weight: 500;
    color: #A56850;
    cursor:pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .toast{
    position: fixed;
    bottom: 24px; left:50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--bg);
    padding: 9px 20px;
    border-radius: 2px;
    font-size: 12.5px;
    z-index: 100;
    opacity:0;
    transition: opacity 0.2s;
    pointer-events:none;
    font-family: 'Playfair Display', 'Song Myung', Georgia, serif;
  }
  .toast.show{ opacity: 1; }

  ::-webkit-scrollbar{ width:0; }  .auth-screen{
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
  }
  .auth-screen .logo-mark{ width: 96px; margin-bottom: 20px; }
  .auth-screen h1{ margin-bottom: 8px; }
  .auth-screen p{ color: var(--ink-soft); font-size: 13.5px; margin-bottom: 28px; }
  .google-btn{
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 24px;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .google-btn img{ width: 18px; height: 18px; }
  .sync-status{
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .logout-link{
    font-size: 11.5px;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    margin-top: 4px;
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>

<script>
const MOODS = [
  {key:'happy', emoji:'😊', label:'좋음'},
  {key:'calm', emoji:'😌', label:'평온'},
  {key:'tired', emoji:'😪', label:'피곤'},
  {key:'sad', emoji:'😢', label:'슬픔'},
  {key:'angry', emoji:'😤', label:'짜증'},
];

let entries = [];
let editingId = null;
let targetDate = null;
let selectedMood = 'happy';
let curTags = [];
let curPhoto = null;
let activeFilter = 'all';
let activeTab = 'calendar';
let trashOpen = false;

function activeEntries(){
  return entries.filter(e => !e.deletedAt);
}
function trashedEntries(){
  return entries.filter(e => e.deletedAt);
}

const today = new Date();
let calYear = today.getFullYear();
let calMonth = today.getMonth(); // 0-indexed

const $ = id => document.getElementById(id);

function todayStr(){
  const d = new Date();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${d.getFullYear()}-${mm}-${dd}`;
}

function fmtDate(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 1600);
}

// ==== Firebase 설정 ====
// 아래 firebaseConfig 값을 본인의 Firebase 프로젝트 설정으로 교체하세요.
// Firebase 콘솔 > 프로젝트 설정 > 일반 > 내 앱 > SDK 설정 및 구성 에서 확인할 수 있어요.
const firebaseConfig = {
  apiKey: "AIzaSyAitwrqfWyRniKOqHM_UEBhf_VQVNQDo0M",
  authDomain: "whalesdiary-bf100.firebaseapp.com",
  projectId: "whalesdiary-bf100",
  storageBucket: "whalesdiary-bf100.firebasestorage.app",
  messagingSenderId: "211379161400",
  appId: "1:211379161400:web:6a717909ec04df91a1d9cd"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const googleProvider = new firebase.auth.GoogleAuthProvider();

let currentUser = null;
let unsubscribeEntries = null;
let unsubscribeTodos = null;
let todoItems = [];

function entriesCollection(){
  return db.collection('users').doc(currentUser.uid).collection('entries');
}

function todoDocRef(dateStr){
  return db.collection('users').doc(currentUser.uid).collection('todos').doc(dateStr);
}

function setSyncStatus(text){
  const el = $('syncStatus');
  if(el) el.textContent = text;
}

function subscribeEntries(){
  setSyncStatus('동기화 중...');
  unsubscribeEntries = entriesCollection().onSnapshot((snapshot)=>{
    entries = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    renderAll();
    setSyncStatus('✓ 동기화됨');
  }, (err)=>{
    console.error(err);
    setSyncStatus('동기화 오류');
  });
}

function subscribeTodos(){
  const ds = todayStr();
  const days = ['일','월','화','수','목','금','토'];
  const d = new Date();
  $('todoDate').textContent = `${d.getMonth()+1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;

  unsubscribeTodos = todoDocRef(ds).onSnapshot((snap)=>{
    todoItems = (snap.exists && Array.isArray(snap.data().items)) ? snap.data().items : [];
    renderTodoList();
  }, (err)=>{
    console.error(err);
  });
}

function saveTodos(){
  todoDocRef(todayStr()).set({ items: todoItems, updatedAt: Date.now() });
}

function renderTodoList(){
  const el = $('todoList');
  if(todoItems.length === 0){
    el.innerHTML = `<div class="empty"><p>오늘 할 일을 추가해보세요.</p></div>`;
  } else {
    el.innerHTML = todoItems.map(t => `
      <div class="todo-item${t.done ? ' done' : ''}" data-id="${t.id}">
        <button class="todo-check" data-toggle="${t.id}"><svg viewBox="0 0 20 20" fill="none">
          <path d="M3.5 10.8 Q6 12.5 8.2 14.8 Q11.5 9.5 16.2 4.2" stroke="#B6432E" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" transform="rotate(-4 10 10)"/>
          <path d="M4 10 Q6.3 12.8 8 14.3 Q12 8.7 16 4.8" stroke="#C55B3F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" transform="rotate(2 10 10) translate(0.4 -0.3)"/>
        </svg></button>
        <div class="todo-text">${escapeHtml(t.text)}</div>
        <button class="todo-del" data-del="${t.id}">✕</button>
      </div>
    `).join('');
  }

  el.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.toggle;
      todoItems = todoItems.map(t => t.id === id ? {...t, done: !t.done} : t);
      renderTodoList();
      saveTodos();
    };
  });
  el.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.del;
      todoItems = todoItems.filter(t => t.id !== id);
      renderTodoList();
      saveTodos();
    };
  });

  const total = todoItems.length;
  const done = todoItems.filter(t => t.done).length;
  $('todoProgress').textContent = total === 0 ? '' : `${done} / ${total} 완료`;
}

function addTodo(){
  const input = $('todoInput');
  const text = input.value.trim();
  if(!text) return;
  todoItems = [...todoItems, { id: Date.now().toString(), text, done: false }];
  input.value = '';
  renderTodoList();
  saveTodos();
}

$('todoAddBtn').onclick = addTodo;
$('todoInput').addEventListener('keydown', (ev) => {
  if(ev.key === 'Enter'){ ev.preventDefault(); addTodo(); }
});

auth.onAuthStateChanged((user)=>{
  if(user){
    currentUser = user;
    $('authScreen').style.display = 'none';
    $('appWrap').style.display = 'block';
    subscribeEntries();
    subscribeTodos();
  } else {
    currentUser = null;
    if(unsubscribeEntries){ unsubscribeEntries(); unsubscribeEntries = null; }
    if(unsubscribeTodos){ unsubscribeTodos(); unsubscribeTodos = null; }
    entries = [];
    todoItems = [];
    $('authScreen').style.display = 'flex';
    $('appWrap').style.display = 'none';
  }
});

$('googleLoginBtn').onclick = async () => {
  try{
    await auth.signInWithPopup(googleProvider);
  }catch(err){
    console.error(err);
    toast('로그인에 실패했어요');
  }
};

$('logoutBtn').onclick = async () => {
  await auth.signOut();
};

function renderMoodFilters(){
  const wrap = $('moodFilters');
  wrap.innerHTML = '';
  const all = document.createElement('div');
  all.className = 'chip' + (activeFilter==='all' ? ' active' : '');
  all.textContent = '전체';
  all.onclick = () => { activeFilter='all'; renderAll(); };
  wrap.appendChild(all);

  MOODS.forEach(m=>{
    const c = document.createElement('div');
    c.className = 'chip' + (activeFilter===m.key ? ' active' : '');
    c.textContent = `${m.emoji} ${m.label}`;
    c.onclick = () => { activeFilter = m.key; renderAll(); };
    wrap.appendChild(c);
  });
}

function renderStats(){
  const active = activeEntries();
  $('statTotal').textContent = active.length;

  const now = new Date();
  const curMonth = now.getMonth(), curYear = now.getFullYear();
  const monthCount = active.filter(e=>{
    const d = new Date(e.date + 'T00:00:00');
    return d.getMonth()===curMonth && d.getFullYear()===curYear;
  }).length;
  $('statMonth').textContent = monthCount;

  // streak calc
  const dateSet = new Set(active.map(e=>e.date));
  let streak = 0;
  let cursor = new Date();
  while(true){
    const mm = String(cursor.getMonth()+1).padStart(2,'0');
    const dd = String(cursor.getDate()).padStart(2,'0');
    const ds = `${cursor.getFullYear()}-${mm}-${dd}`;
    if(dateSet.has(ds)){
      streak++;
      cursor.setDate(cursor.getDate()-1);
    } else break;
  }
  $('statStreak').textContent = streak;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderAll(){
  renderMoodFilters();
  renderStats();
  renderList();
  renderCalendar();
  renderTrashLink();
  renderTrashList();
}

function renderCalendar(){
  const grid = $('calGrid');
  const first = new Date(calYear, calMonth, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const entryDates = new Set(activeEntries().map(e=>e.date));
  const todayDs = todayStr();

  $('calTitle').textContent = `${calYear}년 ${calMonth + 1}월`;

  grid.innerHTML = '';
  for(let i = 0; i < startWeekday; i++){
    const blank = document.createElement('div');
    blank.className = 'cal-day cal-blank';
    grid.appendChild(blank);
  }
  for(let d = 1; d <= daysInMonth; d++){
    const mm = String(calMonth + 1).padStart(2,'0');
    const dd = String(d).padStart(2,'0');
    const ds = `${calYear}-${mm}-${dd}`;
    const hasEntry = entryDates.has(ds);
    const cell = document.createElement('div');

function renderMoodPick(){
  const wrap = $('moodPick');
  wrap.innerHTML = '';
  MOODS.forEach(m=>{
    const d = document.createElement('div');
    d.className = 'mood-opt' + (selectedMood===m.key ? ' sel' : '');
    d.textContent = m.emoji;
    d.onclick = () => { selectedMood = m.key; renderMoodPick(); };
    wrap.appendChild(d);
  });
}

function renderCurTags(){
  const wrap = $('curTags');
  wrap.innerHTML = '';
  curTags.forEach((t,i)=>{
    const el = document.createElement('div');
    el.className = 'cur-tag';
    el.innerHTML = `#${escapeHtml(t)} <span>✕</span>`;
    el.querySelector('span').onclick = () => { curTags.splice(i,1); renderCurTags(); };
    wrap.appendChild(el);
  });
}

function renderPhotoPreview(){
  const addBtn = $('photoAddBtn');
  const preview = $('photoPreview');
  const img = $('photoPreviewImg');
  if(curPhoto){
    img.src = curPhoto;
    preview.style.display = 'block';
    addBtn.style.display = 'none';
  } else {
    preview.style.display = 'none';
    addBtn.style.display = 'block';
  }
}

function handlePhotoFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 900;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      curPhoto = canvas.toDataURL('image/jpeg', 0.75);
      renderPhotoPreview();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function openEditor(id, dateStr){
  editingId = id;
  targetDate = dateStr || todayStr();
  const e = entries.find(x=>x.id===id);
  if(e){
    $('sheetTitle').textContent = `${fmtDate(e.date)} 일기`;
    selectedMood = e.mood;
    $('entryTitle').value = e.title || '';
    $('entryBody').value = e.body || '';
    curTags = [...(e.tags||[])];
    curPhoto = e.photo || null;
    $('deleteBtn').style.display = 'block';
  } else {
    $('sheetTitle').textContent = `${fmtDate(targetDate)} 일기 쓰기`;
    selectedMood = 'happy';
    $('entryTitle').value = '';
    $('entryBody').value = '';
    curTags = [];
    curPhoto = null;
    $('deleteBtn').style.display = 'none';
  }
  renderMoodPick();
  renderCurTags();
  renderPhotoPreview();
  $('tagInput').value = '';
  $('photoInput').value = '';
  $('overlay').classList.add('open');
}

function closeEditor(){
  $('overlay').classList.remove('open');
  editingId = null;
}

function switchTab(tab){
  activeTab = tab;
  $('tabCalendarBtn').classList.toggle('active', tab === 'calendar');
  $('tabListBtn').classList.toggle('active', tab === 'list');
  $('tabTodoBtn').classList.toggle('active', tab === 'todo');
  $('calendarView').style.display = tab === 'calendar' ? 'block' : 'none';
  $('listView').style.display = tab === 'list' ? 'block' : 'none';
  $('todoView').style.display = tab === 'todo' ? 'block' : 'none';
}

$('tabCalendarBtn').onclick = () => switchTab('calendar');
$('tabListBtn').onclick = () => switchTab('list');
$('tabTodoBtn').onclick = () => switchTab('todo');
$('calPrev').onclick = () => {
  calMonth--;
  if(calMonth < 0){ calMonth = 11; calYear--; }
  renderCalendar();
};
$('calNext').onclick = () => {
  calMonth++;
  if(calMonth > 11){ calMonth = 0; calYear++; }
  renderCalendar();
};
$('openNewCal').onclick = () => {
  const ds = todayStr();
  const existing = activeEntries().find(e=>e.date===ds);
  openEditor(existing ? existing.id : null, ds);
};

$('openNew').onclick = () => openEditor(null, todayStr());
$('closeSheet').onclick = closeEditor;
$('overlay').onclick = (ev) => { if(ev.target.id==='overlay') closeEditor(); };

$('tagAddBtn').onclick = () => {
  const v = $('tagInput').value.trim();
  if(v && !curTags.includes(v)){
    curTags.push(v);
    renderCurTags();
  }
  $('tagInput').value = '';
};
$('tagInput').addEventListener('keydown', (ev)=>{
  if(ev.key==='Enter'){ ev.preventDefault(); $('tagAddBtn').click(); }
});

$('photoAddBtn').onclick = () => $('photoInput').click();
$('photoInput').addEventListener('change', (ev)=>{
  const file = ev.target.files && ev.target.files[0];
  handlePhotoFile(file);
});
$('photoRemoveBtn').onclick = () => {
  curPhoto = null;
  $('photoInput').value = '';
  renderPhotoPreview();
};

$('saveBtn').onclick = async () => {
  const title = $('entryTitle').value.trim();
  const body = $('entryBody').value.trim();
  if(!body){
    toast('내용을 입력해주세요');
    return;
  }
  if(!currentUser){
    toast('로그인이 필요해요');
    return;
  }

  const id = editingId || Date.now().toString();
  const data = {
    date: editingId ? (entries.find(x=>x.id===editingId)?.date || targetDate) : (targetDate || todayStr()),
    title, body,
    mood: selectedMood,
    tags: [...curTags],
    photo: curPhoto,
    createdAt: editingId ? (entries.find(x=>x.id===editingId)?.createdAt || Date.now()) : Date.now()
  };

  try{
    await entriesCollection().doc(id).set(data);
    closeEditor();
    toast('저장되었어요 🌼');
  }catch(err){
    console.error(err);
    toast('저장에 실패했어요');
  }
};

$('deleteBtn').onclick = async () => {
  if(!currentUser || !editingId) return;
  try{
    await entriesCollection().doc(editingId).update({ deletedAt: Date.now() });
    closeEditor();
    toast('휴지통으로 이동했어요');
  }catch(err){
    console.error(err);
    toast('삭제에 실패했어요');
  }
};

function renderTrashLink(){
  const link = $('trashLink');
  const trashed = trashedEntries();
  if(trashed.length === 0){
    link.style.display = 'none';
    $('trashList').innerHTML = '';
    trashOpen = false;
    return;
  }
  link.style.display = 'block';
  link.textContent = trashOpen ? '휴지통 닫기' : `휴지통 보기 (${trashed.length})`;
}

function renderTrashList(){
  const el = $('trashList');
  const trashed = trashedEntries().sort((a,b)=> b.deletedAt - a.deletedAt);
  if(!trashOpen || trashed.length === 0){ el.innerHTML = ''; return; }

  el.innerHTML =
    `<div class="trash-header"><button class="trash-empty-btn" id="emptyTrashBtn">휴지통 비우기</button></div>` +
    trashed.map(e => `
      <div class="trash-row">
        <div class="trash-row-main">
          <div class="trash-title">${escapeHtml(e.title || '제목 없음')}</div>
          <div class="trash-date">${fmtDate(e.date)}</div>
        </div>
        <button class="trash-restore" data-restore="${e.id}">복원</button>
      </div>
    `).join('');

  el.querySelectorAll('[data-restore]').forEach(btn => {
    btn.onclick = async () => {
      try{
        await entriesCollection().doc(btn.dataset.restore).update({ deletedAt: null });
        toast('복원되었어요 🌼');
      }catch(err){
        console.error(err);
        toast('복원에 실패했어요');
      }
    };
  });

  const emptyBtn = $('emptyTrashBtn');
  if(emptyBtn){
    emptyBtn.onclick = async () => {
      if(!confirm('휴지통을 완전히 비울까요? 삭제한 일기는 복구할 수 없어요.')) return;
      try{
        await Promise.all(trashedEntries().map(e => entriesCollection().doc(e.id).delete()));
        toast('휴지통을 비웠어요');
      }catch(err){
        console.error(err);
        toast('휴지통 비우기에 실패했어요');
      }
    };
  }
}

$('trashLink').onclick = () => {
  trashOpen = !trashOpen;
  renderTrashLink();
  renderTrashList();
};

(function initTodayLabel(){
  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];
  $('todayLabel').textContent = `${d.getMonth()+1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;
})();

</script>

</body>
</html>
